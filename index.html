<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bike Models</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Popular Bike Models</h1>
  </header>

  <section class="bike-gallery">
    <div class="bike-card">
      <img src="img/sportbike.jpg" alt="Sport Bike">
      <h2>Sport Bike</h2>
      <p>High-performance bikes for speed enthusiasts. Designed for agility and thrill.</p>
    </div>

    <div class="bike-card">
      <img src="img/cruiserbike.jpeg" alt="Cruiser Bike">
      <h2>Cruiser Bike</h2>
      <p>Perfect for long rides with a laid-back riding position and classic styling.</p>
    </div>

    <div class="bike-card">
      <img src="img/dirtbike2.jpeg" alt="Dirt Bike">
      <h2>Dirt Bike</h2>
      <p>Lightweight and rugged, built to conquer off-road terrains with ease.</p>
    </div>
  </section>
</body>
</html>
